spring.application.name=api-gateway
server.port=8090

spring.cloud.circuitbreaker.resilience4j.disable-threadpool=true

resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.userService.baseConfig=default
resilience4j.circuitbreaker.instances.userService.slowCallDurationThreshold=10s
resilience4j.circuitbreaker.instances.userService.slowCallRateThreshold=70
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.client=DEBUG

management.endpoints.web.exposure.include=health,metrics,circuitbreakers
management.endpoint.health.show-details=always